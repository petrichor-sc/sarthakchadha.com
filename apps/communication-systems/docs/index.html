,(0,I.jsxs)(`button`,{className:`lab-primary`,onClick:()=>e.onMode(`software`),children:[`Open the software receiver `,(0,I.jsx)(ae,{size:16})]})]})]})})}var Kt=[{slides:`1–4`,title:`How this course works`,summary:`Build a receiver, understand it, explain it.`,points:[`The course assumes Analog and Digital Signal Processing. Lecture slides and videos, weekly exercise sheets, and discussion materials are provided through Moodle. Work on the problem sheets before their discussion.`,`Assessment combines a class project with an individual oral exam. The project follows Software Receiver Design, Chapter 15; submit executable source code and a report. Teams have at most two students and must identify each person’s contribution.`,`Discuss ideas with classmates, attribute borrowed work, and write your own code and report. The textbook’s exercises and MATLAB scripts provide additional practice.`],note:`Write down the project deliverables and how you will keep your own contributions clear.`,book:`Chapter 15 · Make It So`,page:343,mode:`receiver`,tags:[`Executable code`,`Project report`,`Individual oral exam`]},{slides:`5`,title:`The course roadmap`,summary:`The big picture becomes a working receiver.`,points:[`Lectures 0–3: introduction to SDR; the six building blocks; channel corruption and modulation; IF mixing, sampling, and interpolation.`,`Lectures 4–7: automatic gain control; digital filter design; bits, symbols, and signals; the idealized receiver.`,`Lectures 8–12: carrier recovery; pulse shaping and receive filtering; timing recovery; linear equalization; coding. This app currently develops Lectures 0–2, with Lecture 0’s later receiver blocks available as previews.`],note:`Which later topic answers each difficulty you see in the first receiver diagram?`,book:`§1.3 · Walk This Way`,page:12,mode:`receiver`,tags:[`Components`,`Synchronization`,`Compensation`,`Decoding`]},{slides:`6–9`,title:`Why software-defined radio?`,summary:`Flexible DSP around a physical analog core.`,points:[`The RF frontend and ADC/DAC connect an analog radio wave to numerical baseband processing. Software can change the communication method without replacing every specialized circuit.`,`The lecture highlights flexible devices, updates, prototyping, signal analysis, and experiments with recorded signals. In this course you simulate and implement a PAM software receiver in MATLAB/Octave, then recover messages from supplied recordings.`,`The lecture’s timeline connects Vanu (1998; FCC certification in 2004), GNU Radio (2001), USRP (2004), repurposed RTL-SDR dongles (2012), and ADALM-Pluto (2017). These are historical milestones presented in the lecture.`],note:`Explain why SDR still needs an antenna, analog filtering, and converters.`,book:`§1.1 · What Is a Digital Radio?`,page:2,mode:`hardware`,tags:[`RF frontend`,`ADC / DAC`,`Baseband DSP`]},{slides:`10–11`,title:`The whole communication system`,summary:`One message, several representations.`,points:[`Transmitter: text → coder → symbols → pulse-shaping filter → baseband → frequency translator → RF. Receiver: received RF → frequency translator → baseband → sampler → quantizer → decoder → reconstructed text.`,`Baseband is centered around 0 Hz. Passband is centered around a nonzero carrier frequency. The lecture introduces radio frequencies from about 3 kHz to 300 GHz.`,`The rest of the lecture connects this overview to the analog/digital split and the PAM system you will build.`],note:`Draw both directions and label what is data, numerical amplitude, voltage, and EM field.`,book:`§1.2 · An Illustrative Design`,page:3,mode:`journey`,tags:[`Data`,`Symbols`,`Baseband`,`RF`]},{slides:`12–15`,title:`Text → bits → symbols → pulses`,summary:`Hello becomes 40 bits, then 20 4-PAM symbols.`,points:[`ASCII Hello has hex bytes 48 65 6C 6C 6F. Each is written as an 8-bit byte. The app uses UTF-8, which agrees with ASCII and supports other characters too.`,`Binary PAM can use −1 and +1, separating the zero bit from no signal. With 4-PAM, 00 → −3, 01 → −1, 10 → +1, and 11 → +3. Two bits per symbol halve the number of symbol intervals, not the amount of information.`,`A pulse shaper scales and shifts pulses spaced by T. The introductory shape is rectangular: each pulse has width T and height equal to its symbol. Symbol rate is 1/T; uncoded 4-PAM bit rate is 2/T.`],note:`Write H as hex, bits, bit pairs, four symbols, and a pulse waveform.`,book:`§1.2 · pp. 3–5`,page:4,mode:`transmitter`,tags:[`H = 0x48`,`01001000`,`−1, −3, +1, −3`]},{slides:`16–17`,title:`Samples → decisions → text`,summary:`Measure at the right times and recover the alphabet.`,points:[`An ideal received signal is an attenuated and delayed copy: r(t) = g x(t − δ). Its pulse centers occur at δ + T/2 + nT.`,`The sampler produces discrete-time measurements. The ideal symbol quantizer removes the gain scale and maps the samples back to the four symbol levels. The decoder reverses the bit mapping and character encoding.`,`ADC amplitude quantization is a separate practical step: it stores measured voltages as finite codes. Its code values are not the original text bits.`],note:`Explain sampling, ADC amplitude quantization, and symbol decisions as three separate ideas.`,book:`§1.2 · pp. 8–12`,page:8,mode:`receiver`,tags:[`Arrival time δ`,`Pulse centers`,`PAM decisions`,`Text`]},{slides:`18`,title:`Where the rubber meets the road`,summary:`The physical channel changes the waveform.`,points:[`The direct path applies gain and delay. Fading makes gain fluctuate. Multipath contributes delayed copies of the message, producing self-interference and intersymbol interference.`,`Other transmitters and disturbances add interference and noise. The receiver must also track carrier frequency and phase, which may drift relative to its own oscillator.`,`Bandwidth is scarce and shared. FDM separates users by frequency, and receiver filtering selects the desired band. Explore carrier mismatch in the software receiver and FDM in ASP / DSP.`],note:`Draw the direct path, echo branch, and two adders. Explain every contribution.`,book:`§4.1 · Channel corruption`,page:59,mode:`channel`,tags:[`Fading`,`Delay`,`Echo`,`Interference`,`Noise`]},{slides:`19–20`,title:`From RF to intermediate frequency`,summary:`Use analog mixing before costly high-rate sampling.`,points:[`For a bandlimited low-pass signal whose highest frequency is fB, use fₛ > 2fB for recovery under the sampling theorem’s assumptions. Attenuate out-of-band content to reduce aliasing; DAC reconstruction also needs filtering to suppress images.`,`Analog mixing with LO frequency f꜀ − fIF produces difference and sum copies. The lecture example is 868 MHz RF mixed with 864.43 MHz LO to obtain 3.57 MHz IF. Filter out the unwanted products.`,`The lecture’s example frontend is a Nooelec NESDR SMArt, with a stated RF tuning range of 25–1750 MHz and IF of 3.57 MHz. Its roughly $25 price is a lecture-era example. The design lesson is to keep analog processing affordable and finish the remaining conversion digitally.`],note:`Calculate both mixer products for the lecture example and state which one is kept.`,book:`§§2.6–2.8 · Downconversion and sampling`,page:24,mode:`hardware`,tags:[`868 MHz RF`,`864.43 MHz LO`,`3.57 MHz IF`]},{slides:`21`,title:`Division of labor: ASP / DSP`,summary:`Physical preparation first; numerical recovery next.`,points:[`Analog processing: RF/IF frequency translation, out-of-band attenuation, and automatic gain control.`,`Digital processing: IF/baseband conversion, carrier tracking, symbol timing by interpolation, and channel compensation by linear filtering.`,`DSP also makes symbol decisions, synchronizes frames by correlation, and decodes symbols into text. The location of some operations can vary by architecture; this is the lecture’s chosen split.`],note:`Make two columns for the lecture’s ASP and DSP tasks and explain the ADC boundary.`,book:`§2.15 · Complete system`,page:38,mode:`hardware`,tags:[`ASP`,`ADC`,`DSP`]},{slides:`22`,title:`The PAM transmitter`,summary:`Coding, bandwidth control, and RF upconversion.`,points:[`The general coder can remove message redundancy through source coding and add protective redundancy through error coding. The Hello illustration uses character encoding and direct PAM mapping; source/error codes are not automatically present.`,`The pulse shaper generates T-spaced pulses whose shape controls the occupied spectrum and fits an allocated channel bandwidth.`,`The analog upconverter amplitude-modulates a sinusoidal RF carrier with those pulses. Inspect source coding, repetition error coding, pulse shapes, and RF conversion in the transmitter explorer.`],note:`Why do source coding and error coding treat redundancy differently?`,book:`§§2.10, 2.14 · Shaping and coding`,page:30,mode:`transmitter`,tags:[`Source coding`,`Error coding`,`Pulse shaping`,`Upconversion`]},{slides:`23`,title:`Channel + analog receiver + ADC`,summary:`Select and measure the signal before software sees it.`,points:[`The shared channel adds distortion, other FDM users, narrowband interference, and noise. The analog receiver band-pass filters, mixes RF down to IF, and applies gain control.`,`The sampler/ADC creates numerical samples separated by Tₛ. Its sampling period is independent of the transmitter’s symbol spacing T. Practical ADCs also have finite amplitude resolution.`,`The course’s B³IG transmitter MATLAB script generates impaired discrete-time recordings for testing the software receiver; the lecture refers to Appendix H. The app illustrates these ideas with its own small models, not that exact recording generator.`],note:`Draw the path from transmitted RF to sampled IF and label the two time spacings.`,book:`§2.15 · End-to-end architecture`,page:38,mode:`hardware`,tags:[`Channel`,`Band-pass + mixer + AGC`,`ADC Tₛ`,`Software receiver`]},{slides:`24`,title:`The six-block software receiver`,summary:`Turn sampled IF into a reconstructed message.`,points:[`Digital downconversion tracks carrier frequency/phase to produce baseband. A pulse-matched filter collects desired pulse energy and suppresses unwanted content. Timing-adjusted downsampling obtains T-spaced symbol estimates.`,`An equalizer compensates for ISI and, in suitable designs, narrowband interference. A decider maps soft values to the nearest alphabet member.`,`The decoder reverses coding and uses frame synchronization to find message boundaries. This is the class project’s architecture in Chapter 15. The receiver explorer opens all six blocks as focused experiments.`],note:`Explain the input, output, and purpose of each of the six software blocks.`,book:`§2.15; Chapter 15`,page:38,mode:`software`,tags:[`Downconvert`,`Matched filter`,`Timing`,`Equalize`,`Decide`,`Decode`]},{slides:`25`,title:`Get ready for the first exercises`,summary:`Make the tools work, then learn one component at a time.`,points:[`Install MATLAB or GNU Octave using your course setup instructions; the textbook’s preface discusses the required environment. The lecture suggests an Ubuntu VM and Octave control/signal packages as one route.`,`Use the course’s introductory ADSP lab to practice MATLAB/Octave. The SRDmatlab.tgz bundle is supplied through Moodle.`,`Start with oscillators, spectra, filters, sampling, nonlinearities, and mixers. Predict what a change will do, run the experiment, then write one sentence explaining the result before attempting the problem sheet.`],note:`Record which tool you will use and the first experiment you want to reproduce.`,book:`Chapter 3 · The Six Elements`,page:40,mode:`journey`,tags:[`MATLAB / Octave`,`SRD scripts`,`Predict → experiment → explain`]}];function qt(e){let[t,n]=(0,h.useState)(6),[r,i]=(0,h.useState)(``),a=Kt[t];return(0,I.jsxs)(`section`,{className:`lecture-guide`,children:[(0,I.jsx)(`header`,{className:`lab-intro`,children:(0,I.jsxs)(`div`,{children:[(0,I.jsx)(`span`,{className:`lab-kicker`,children:`LECTURE 00 · SLIDE-BY-SLIDE COMPANION`}),(0,I.jsx)(`h2`,{children:`The whol
